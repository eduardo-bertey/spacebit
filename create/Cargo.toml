[package]
name = "matrict_rust_app"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "App Rust + MatRiCT-Au embebido por FFI, con parche imagen-cero y texto firmado"

[dependencies]

# cc se usa desde build.rs: debe ir en build-dependencies, no en dependencies.
[build-dependencies]
cc = "1.0"

[lib]
name = "spacebit_au"
path = "src/lib.rs"

[[bin]]
name = "matrict_rust_app"
path = "src/main.rs"
