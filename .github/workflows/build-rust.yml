name: Compilar Rust (solo build, sin ejecutar tests)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: MatRiCT-Au Rust - compilar .exe
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # build.rs compila los C con cc. No se ejecuta ningun test.
      - name: cargo build --release (target GNU)
        run: cargo build --release --target x86_64-pc-windows-gnu --manifest-path create/Cargo.toml

      - name: Listar (NO ejecutar) el binario
        run: ls -lh create/target/x86_64-pc-windows-gnu/release/matrict_rust_app.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rust-binario
          path: create/target/x86_64-pc-windows-gnu/release/matrict_rust_app.exe
          if-no-files-found: error
